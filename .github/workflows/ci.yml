name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sql-ut11-collector:
    name: SQL UT11 offline collector (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test full-tree evidence collector (synthetic only)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          IBCMD_TEST_KEEP_FIXTURES: '1'
          IBCMD_SQL_UT11_TEST_ROOT: ${{ runner.temp }}/issue359-collector-tests
        run: python3 tests/scripts/test_compare_sql_ut11.py

  platform-evidence-harness:
    name: Platform evidence harness
    runs-on: ubuntu-latest
    env:
      IBCMD_TEST_KEEP_FIXTURES: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test exact-build evidence audit
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/scripts/platform_acceptance_test.py -v

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

  portable:
    name: Portable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check standalone workspace layers
        run: cargo check --locked --workspace --exclude ibcmd-rs --all-targets

      - name: Check release-shaped root without platform oracle
        run: cargo check --locked -p ibcmd-rs --all-targets --no-default-features

      - name: Clippy standalone workspace layers
        run: cargo clippy --locked --workspace --exclude ibcmd-rs --all-targets -- -D warnings

      - name: Test standalone workspace layers
        run: cargo test --locked --workspace --exclude ibcmd-rs

      - name: Test portable root smoke
        run: "cargo test --locked -p ibcmd-rs --test integration portable_root_smoke::"

      - name: Audit release-shaped platform boundary
        run: "cargo test --locked -p ibcmd-rs --test integration platform_oracle_boundary:: --no-default-features"

      - name: Test CF corruption and property corpus
        run: "cargo test --locked -p ibcmd-rs --test integration cf_corruption::"

      - name: Test XML dialect corpus
        run: "cargo test --locked -p ibcmd-rs --test integration xml_profiles::"

      # The root library's unit tests (the converters and the load/export
      # engines) build their paths portably, so they run on every OS.
      - name: Test the root library
        run: cargo test --locked -p ibcmd-rs --lib --no-default-features

      # Native XML tree -> `cf bootstrap --base-free` -> CF -> XML tree over
      # the three retained 8.3.27.2214 corpora (Untru/ibcmd-rs#351).
      - name: Test the XML to CF round trip
        run: "cargo test --locked -p ibcmd-rs --test integration cf_native_roundtrip:: --no-default-features"

  legacy-windows:
    name: Legacy Root (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check legacy root targets with explicit platform oracle
        run: cargo check --locked -p ibcmd-rs --all-targets --features platform-oracle

      - name: Compile legacy root test harness with explicit platform oracle
        run: cargo test --locked -p ibcmd-rs --no-run --features platform-oracle
