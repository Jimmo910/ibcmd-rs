name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  platform-evidence-harness:
    name: Platform evidence harness
    runs-on: ubuntu-latest
    env:
      IBCMD_TEST_KEEP_FIXTURES: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test exact-build evidence audit
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/scripts/platform_acceptance_test.py -v
