[package]
name = "ibcmd-metadata-model"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The base-free metadata descriptor model: a metadata object's XML compiled into the native text of its Config row and a stored row exported back to XML, for every family of kinds, with the source-tree index and the descriptor and export audits"

[dependencies]
anyhow = "1.0"
# Line breaks of a stored string; base64 of a flowchart picture.
ibcmd-1c-text = { path = "../ibcmd-1c-text" }
# Standard pictures, built-in type ids and command groups.
ibcmd-1c-vocab = { path = "../ibcmd-1c-vocab" }
# The ExternalDataSource descriptor layout check.
ibcmd-compiler-families = { path = "../ibcmd-compiler-families" }
ibcmd-core = { path = "../ibcmd-core" }
# Native colour, font, border and shortcut spellings.
ibcmd-form-native = { path = "../ibcmd-form-native" }
# The metadata XML element tree and the source context.
ibcmd-metadata-blob = { path = "../ibcmd-metadata-blob" }
# The stored rows' raw deflate (`audit`).
ibcmd-module-blob = { path = "../ibcmd-module-blob" }
# The process-wide worker pools the audits and the index run on.
ibcmd-parallel = { path = "../ibcmd-parallel" }
# The platform of an XML dialect.
ibcmd-platform = { path = "../ibcmd-platform" }
# The brace tree and its list macro.
ibcmd-restructure = { path = "../ibcmd-restructure" }
ibcmd-schema = { path = "../ibcmd-schema" }
ibcmd-xml = { path = "../ibcmd-xml" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
uuid = "1.19"
walkdir = "2.5"

[dev-dependencies]
uuid = { version = "1.19", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
