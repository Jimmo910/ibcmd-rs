[package]
name = "ibcmd-compiler-readiness"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Bootstrap-readiness manifest of the source-to-storage compiler: the bundled compatibility/bootstrap.json inventory and the fail-closed build preflight"

[dependencies]
# The storage patch the preflight checks.
ibcmd-core = { path = "../ibcmd-core" }
# The canonical source-tree classifier the manifest mirrors.
ibcmd-xml = { path = "../ibcmd-xml" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
