[package]
name = "ibcmd-form-body"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Inputs of the managed-form body reader: the per-export indexes and compatibility rules a form is parsed against, and the dump timing report it adds to"

[dependencies]
# `MssqlDumpTimingReport` derives both, as in the root.
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
