[package]
name = "ibcmd-form-body"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Inputs of the managed-form body reader: the per-export indexes and compatibility rules a form is parsed against, the dump timing report it adds to, and the form body record, event block, 8.5 layout conversion and data-composition normalizer it reads"

[dependencies]
# `layout_8_5_1`'s errors, as in the root.
anyhow = "1.0"
ibcmd-1c-text = { path = "../ibcmd-1c-text" }
ibcmd-1c-vocab = { path = "../ibcmd-1c-vocab" }
ibcmd-core = { path = "../ibcmd-core" }
ibcmd-schema = { path = "../ibcmd-schema" }
ibcmd-xml = { path = "../ibcmd-xml" }
quick-xml = "0.38"
# `MssqlDumpTimingReport` derives both, as in the root.
serde = { version = "1.0", features = ["derive"] }
uuid = "1.19"

[lints.rust]
unsafe_code = "forbid"
