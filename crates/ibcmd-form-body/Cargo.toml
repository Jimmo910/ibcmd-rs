[package]
name = "ibcmd-form-body"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The managed-form body reader, which writes a stored form's Form.xml, with the per-export indexes and compatibility rules a form is parsed against, the dump timing report it adds to, and the form body record (with its reader, the Form Attributes tail layout and the braced-record text primitives), event block, adoption model, 8.5 layout conversion and data-composition normalizer it reads"

[dependencies]
# `layout_8_5_1`'s errors, as in the root.
anyhow = "1.0"
ibcmd-1c-text = { path = "../ibcmd-1c-text" }
ibcmd-1c-vocab = { path = "../ibcmd-1c-vocab" }
ibcmd-core = { path = "../ibcmd-core" }
ibcmd-form-schema = { path = "../ibcmd-form-schema" }
# The MOXCEL reader, for a spreadsheet document a form attribute holds.
ibcmd-moxel = { path = "../ibcmd-moxel" }
ibcmd-schema = { path = "../ibcmd-schema" }
ibcmd-xml = { path = "../ibcmd-xml" }
quick-xml = "0.38"
# `MssqlDumpTimingReport` and the form reader's trace events derive both, as
# in the root.
serde = { version = "1.0", features = ["derive"] }
# The digests a form reads or reports (a form diagnostic's raw value, the
# empty server-state envelope), as in the root.
sha2 = "0.10"
uuid = "1.19"

[dev-dependencies]
# The form reader's tests: deflated test bodies and JSON fixtures, as in the
# root.
flate2 = "1.1"
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
