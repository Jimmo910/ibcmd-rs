[package]
name = "ibcmd-mssql-live"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "MSSQL main activation and its live track: the native platform profile and its RAC/RAS probes, the activation plan and SQL, the live gate and continuation, the recovery and live artifacts, the worker switch, and the managed worker's lifetime authority"

[dependencies]
anyhow = "1.0"
# `MssqlNativePlatformProfile` is a `--platform-profile` value; the live
# continuation's arguments are a clap `Args` group, as in the root.
clap = { version = "4.5", features = ["derive"] }
# The activation reads the raw-deflated `versions` row.
flate2 = "1.1"
# The stored platform-8.5 dynamic-update root's base64 payload.
ibcmd-1c-text = { path = "../ibcmd-1c-text" }
# The bundled platform profiles (`MssqlNativePlatformProfile::effective_profile`).
ibcmd-compiler-families = { path = "../ibcmd-compiler-families" }
ibcmd-core = { path = "../ibcmd-core" }
# The database clients (`crate::sql`, as in the root).
ibcmd-sql = { path = "../ibcmd-sql" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.19", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# The managed worker's process identity and system directory, as in the root.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints.rust]
# The managed worker reads Windows process identities through FFI and allows
# it on that module (`lib.rs`); nothing else may.
unsafe_code = "deny"
